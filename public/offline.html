<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RME Voyage — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d3f38;
      color: #f8f7f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 420px; }
    .icon {
      width: 96px; height: 96px;
      margin: 0 auto 32px;
      background: #eead59;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #eead59;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(248, 247, 242, 0.8);
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #eead59;
      color: #0d3f38;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(238, 173, 89, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🧭</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      RME Voyage ne peut pas se connecter à Internet pour le moment.
      Vos données mises en cache restent disponibles.
      Vérifiez votre connexion et réessayez.
    </p>
    <a href="/" class="btn">Réessayer</a>
  </div>
</body>
</html>
