# Backup hosting on Netlify (free plan), used while Vercel is unavailable.
# Netlify detects Next.js and applies its runtime; this only states the build.
[build]
  command = "npm run build"
  publish = ".next"
  # Économie de crédits : pas de build si seuls docs, tests ou scripts changent.
  # Code 0 = on saute le build ; code 1 (ou erreur, ex. premier build) = on construit.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app components lib packages public netlify proxy.ts config.ts package.json package-lock.json next.config.mjs tailwind.config.ts postcss.config.mjs tsconfig.json netlify.toml"

[build.environment]
  NODE_VERSION = "20"

# Next.js adapter (server functions, routing, images). Not auto-installed
# for API-uploaded deploys, so it is declared explicitly.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify serves .webmanifest as application/octet-stream by default.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
