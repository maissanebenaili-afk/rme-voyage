# Backup hosting on Netlify (free plan), used while Vercel is unavailable.
# Netlify detects Next.js and applies its runtime; this only states the build.
[build]
  command = "npm run build"
  publish = ".next"
  # Économie de crédits. Code 0 = on saute le build ; code 1 (ou erreur, ex. premier
  # build) = on construit.
  # 1) Pas d'aperçu pour les branches des robots (prix carburant, veille BOAMP,
  #    Dependabot) : chaque PR automatique consommait des crédits, et la CI GitHub
  #    les vérifie déjà. $HEAD est le nom de la branche dans un aperçu de PR,
  #    $BRANCH y vaut « pull/N/head » : on teste les deux.
  # 2) Pas de build si seuls docs, tests ou scripts changent.
  ignore = 'for b in "$HEAD" "$BRANCH"; do case "$b" in data/*|dependabot/*|omega-veritas/*|lab/*) exit 0;; esac; done; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app components lib packages public netlify proxy.ts config.ts package.json package-lock.json next.config.mjs tailwind.config.ts postcss.config.mjs tsconfig.json netlify.toml'

[build.environment]
  NODE_VERSION = "20"

# Next.js adapter (server functions, routing, images). Not auto-installed
# for API-uploaded deploys, so it is declared explicitly.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Image CDN remote image allowlist
[images]
  remote_images = ['https://images\.unsplash\.com/.*', 'https://commons\.wikimedia\.org/.*']

# Netlify serves .webmanifest as application/octet-stream by default.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# HTML pages: Stale-While-Revalidate caching at the Netlify CDN layer
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# Long-term immutable caching for hashed Next.js static assets, images, and fonts
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/coloriages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/kalimat/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/feuilletons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pages retirées le 2026-11-05 à la demande du propriétaire : on renvoie vers la boutique
# plutôt que vers une erreur 404 pour les anciens liens.
[[redirects]]
  from = "/marwa-caftan/*"
  to = "/boutique"
  status = 301
  force = true

[[redirects]]
  from = "/marwa-caftan"
  to = "/boutique"
  status = 301
  force = true

[[redirects]]
  from = "/afarah-nassim/*"
  to = "/boutique"
  status = 301
  force = true

[[redirects]]
  from = "/afarah-nassim"
  to = "/boutique"
  status = 301
  force = true
