name: OMEGA-VERITAS CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'omega-veritas/**'
      - '.github/workflows/omega-veritas-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'omega-veritas/**'
      - '.github/workflows/omega-veritas-ci.yml'

jobs:
  typecheck-test-proof:
    name: Typecheck, Test & Proof
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega-veritas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: omega-veritas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Dependency-free proof runner
        run: npm run proof
