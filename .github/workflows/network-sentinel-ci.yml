name: Network Sentinel CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'network-sentinel/**'
  pull_request:
    branches: [main]
    paths:
      - 'network-sentinel/**'

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network-sentinel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: network-sentinel/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
