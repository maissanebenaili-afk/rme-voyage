name: Android bundle

# Builds the Play Store bundle (AAB) and a debug APK for testing on a phone.
# Signed only when the four RME_UPLOAD_* secrets exist; otherwise unsigned.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.ts', 'package-lock.json', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', 'capacitor.config.ts', 'package-lock.json', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  bundle:
    name: Build AAB + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.RME_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RME_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key secret: the bundle will be unsigned."
          fi

      - name: Build
        working-directory: android
        env:
          RME_VERSION_CODE: ${{ github.run_number }}
          RME_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.RME_UPLOAD_KEYSTORE_PASSWORD }}
          RME_UPLOAD_KEY_ALIAS: ${{ secrets.RME_UPLOAD_KEY_ALIAS }}
          RME_UPLOAD_KEY_PASSWORD: ${{ secrets.RME_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Check target API level
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | tee badging.txt | grep -E "^package|targetSdkVersion"
          grep -q "targetSdkVersion:'36'" badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rme-voyage-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
